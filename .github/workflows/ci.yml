name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: build / vet / tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: test -z "$(gofmt -l .)" || (echo "gofmt needed:"; gofmt -l .; exit 1)
      - run: go vet ./...
      - run: go vet -tags=integration ./...
      - run: go build ./...
      - run: go test -race ./...
